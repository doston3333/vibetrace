name: Native Codex smoke

on:
  workflow_dispatch:
    inputs:
      codex_model:
        description: Optional Codex model override for the smoke prompt
        required: false
        type: string
  workflow_call:
    inputs:
      codex_model:
        description: Optional Codex model override for the smoke prompt
        required: false
        type: string
    secrets:
      CODEX_OPENAI_API_KEY:
        required: true

permissions:
  contents: read

jobs:
  native-smoke:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 24
          - os: macos-15-intel
            node: 24
          - os: macos-15
            node: 24
          - os: windows-latest
            node: 24
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.33.4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm install --global @openai/codex@0.146.1
      - run: pnpm build
      - name: Run native smoke
        run: pnpm native:smoke
        env:
          OPENAI_API_KEY: ${{ secrets.CODEX_OPENAI_API_KEY }}
          VIBETRACE_CODEX_MODEL: ${{ inputs.codex_model }}
          VIBETRACE_NATIVE_SMOKE_OUTPUT: ${{ runner.temp }}/vibetrace-native-smoke.json
      - name: Upload native smoke evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-smoke-${{ matrix.os }}-node-${{ matrix.node }}
          path: ${{ runner.temp }}/vibetrace-native-smoke.json
          if-no-files-found: error
