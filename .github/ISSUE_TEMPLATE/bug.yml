name: Bug report
description: Report a reproducible VibeTrace defect without private trace content.
title: '[Bug]: '
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: Do not include secrets, credentials, or unredacted trace content. Report security issues privately.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0 or full commit SHA
    validations:
      required: true
  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        [Ubuntu/Linux, macOS Intel, macOS Apple Silicon, Windows 11, Other]
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Safe reproduction
      description: Provide minimal steps using synthetic or fully redacted data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed secrets and private trace content from this report.
          required: true
        - label: This is not a security vulnerability.
          required: true
